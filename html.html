<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HTML Studies</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    padding:40px;
}

h1{
    text-align:center;
    color:#38bdf8;
    margin-bottom:40px;
    font-size:45px;
}

.container{
    display:flex;
    flex-wrap:wrap;
    gap:25px;
    justify-content:center;
}

.card{
    background:#1e293b;
    width:300px;
    padding:25px;
    border-radius:20px;
    transition:0.3s;
    box-shadow:0 0 15px rgba(0,0,0,0.3);
}

.card:hover{
    transform:translateY(-10px);
}

h2{
    color:#38bdf8;
    margin-bottom:10px;
}

p{
    margin-bottom:20px;
    color:#cbd5e1;
}

button{
    background:#38bdf8;
    border:none;
    padding:10px 20px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
}

a{
    text-decoration:none;
}

</style>

</head>

<body>

<h1>Área de Estudos HTML</h1>

<div class="container">

    <div class="card">
        <h2>Estrutura HTML</h2>

        <p>
            Aprenda html, head e body.
        </p>

        <a href="estrutura.html">
            <button>Estudar</button>
        </a>
    </div>

    <div class="card">
        <h2>Títulos e Parágrafos</h2>

        <p>
            Aprenda h1 até h6 e p.
        </p>

        <a href="titulos.html">
            <button>Estudar</button>
        </a>
    </div>

    <div class="card">
        <h2>Links e Imagens</h2>

        <p>
            Aprenda a, img e navegação.
        </p>

        <a href="links.html">
            <button>Estudar</button>
        </a>
    </div>

</div>

</body>
</html>
