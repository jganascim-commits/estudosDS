<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Estrutura HTML</title>

<style>

body{
    background:#0f172a;
    color:white;
    font-family:Arial;
    padding:40px;
}

.container{
    max-width:900px;
    margin:auto;
    background:#1e293b;
    padding:30px;
    border-radius:20px;
}

h1{
    color:#38bdf8;
    margin-bottom:20px;
}

code{
    background:black;
    display:block;
    padding:20px;
    margin-top:20px;
    border-radius:10px;
    color:#38bdf8;
}

button{
    margin-top:30px;
    background:#38bdf8;
    border:none;
    padding:10px 20px;
    border-radius:10px;
    cursor:pointer;
}

</style>

</head>
<body>

<div class="container">

<h1>Estrutura Básica HTML</h1>

<p>
Todo site HTML começa com uma estrutura básica.
</p>

<code>

&lt;!DOCTYPE html&gt;

&lt;html&gt;

&lt;head&gt;
    &lt;title&gt;Meu Site&lt;/title&gt;
&lt;/head&gt;

&lt;body&gt;

    &lt;h1&gt;Olá Mundo&lt;/h1&gt;

&lt;/body&gt;

&lt;/html&gt;

</code>

<p>
A tag head contém configurações do site.
</p>

<p>
A tag body contém o conteúdo visível.
</p>

<a href="html.html">
    <button>Voltar</button>
</a>

</div>

</body>
</html>
